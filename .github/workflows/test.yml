name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 内容脚本回归测试
        run: node test/run.mjs

      - name: 弹窗结构自检
        run: node test/popup-check.mjs
