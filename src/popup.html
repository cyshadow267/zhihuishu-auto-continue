<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>自动续播 · 智慧树</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1a2438;
      --line: #2b3a55;
      --text: #e6edf7;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      max-height: 580px;
      overflow-y: auto;
      margin: 0;
      padding: 14px 14px 10px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .status {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 10px;
      margin-bottom: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      min-height: 36px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #64748b; flex: none;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
    .dot.warn { background: var(--warn); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid rgba(43, 58, 85, .55);
    }
    .row:last-of-type { border-bottom: none; }
    .row label { color: var(--text); }
    .row .hint { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }

    /* 开关 */
    .switch { position: relative; width: 38px; height: 21px; flex: none; }
    /* input 必须铺满整块并压在视觉层之上，否则点到的是后面的 span，
       勾选状态不会变——之前开关点不动就是这个原因。 */
    .switch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      z-index: 2;
      cursor: pointer;
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      pointer-events: none;   /* 视觉层不吃点击，全部交给上面的 input */
      background: #334155; border-radius: 999px; transition: background .2s;
    }
    .slider::before {
      content: ""; position: absolute; left: 2px; top: 2px;
      width: 17px; height: 17px; border-radius: 50%;
      background: #fff; transition: transform .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(17px); }

    select, input[type="text"] {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    input[type="text"] { width: 118px; }
    input[type="range"] { width: 118px; accent-color: var(--accent); }

    .group-title {
      margin: 12px 0 2px;
      font-size: 11px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 7px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 7px;
      font: 500 12px/1.4 inherit;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: .45; cursor: default; }
    footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>自动续播 · 智慧树</h1>
    <div class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </div>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在检测当前页面…</span>
  </div>

  <div class="row">
    <div>
      <label for="autoResume">暂停后自动播放</label>
      <span class="hint">缓冲、切走再回来、播放器自己停下都会续上</span>
    </div>
    <div class="switch">
      <input type="checkbox" id="autoResume" />
      <span class="slider"></span>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="autoNext">播完切下一节</label>
      <span class="hint">结束时点击页面上的「下一节 / 继续学习」</span>
    </div>
    <div class="switch">
      <input type="checkbox" id="autoNext" />
      <span class="slider"></span>
    </div>
  </div>

  <div class="row">
    <span>续播延迟</span>
    <div>
      <input type="range" id="resumeDelay" min="0" max="10" step="0.5" />
      <span id="delayLabel" style="font-variant-numeric: tabular-nums;">2.0s</span>
    </div>
  </div>

  <div class="row">
    <div>
      <span>播放倍速</span>
      <span class="hint">平台若限制倍速，设置会被忽略</span>
    </div>
    <select id="playbackRate">
      <option value="1">1.0×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2.0×</option>
    </select>
  </div>

  <div class="group-title">切换方式</div>

  <div class="row">
    <div>
      <span>播完后怎么切</span>
      <span class="hint">先找「下一节」按钮，找不到再点左侧目录</span>
    </div>
    <select id="nextStrategy">
      <option value="auto">自动</option>
      <option value="button">只点按钮</option>
      <option value="catalog">只点目录</option>
    </select>
  </div>

  <div class="row">
    <div>
      <span>目录试运行</span>
      <span class="hint">只提示「将点击第 N 项」，确认无误再关掉</span>
    </div>
    <div class="switch">
      <input type="checkbox" id="catalogDryRun" />
      <span class="slider"></span>
    </div>
  </div>

  <div class="row">
    <div>
      <span>目录项选择器</span>
      <span class="hint">自动识别失败时填，例如 .catalog-item</span>
    </div>
    <input type="text" id="catalogItemSelector" placeholder="留空=自动" />
  </div>

  <div class="row">
    <div>
      <span>PPT 停留秒数</span>
      <span class="hint">没有视频的条目停留多久后继续下一项</span>
    </div>
    <div>
      <input type="range" id="pptDwell" min="3" max="30" step="1" />
      <span id="pptDwellLabel" style="font-variant-numeric: tabular-nums;">8s</span>
    </div>
  </div>

  <div class="group-title">高级</div>

  <div class="row">
    <div>
      <span>「下一节」选择器</span>
      <span class="hint">自动找不到时填，例如 .next-btn</span>
    </div>
    <input type="text" id="nextSelector" placeholder="留空=自动识别" />
  </div>

  <div class="row">
    <span>页面角标提示</span>
    <div class="switch">
      <input type="checkbox" id="showBadge" />
      <span class="slider"></span>
    </div>
  </div>

  <button id="resumeNow">立即恢复播放</button>

  <footer>
    <span id="ver"></span> · 只控制播放器的播放 / 暂停与切换点击，不上报或改写观看进度，也不处理弹题。
  </footer>

  <script src="popup.js"></script>
</body>
</html>
